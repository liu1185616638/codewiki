[workspace]
resolver = "3"
members = [
    "crates/codewiki-core",
    "crates/codewiki-analysis",
    "crates/codewiki-wiki",
    "crates/codewiki-cli",
]
default-members = ["crates/codewiki-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/liu1185616638/codewiki"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
codewiki-core = { path = "crates/codewiki-core" }
codewiki-analysis = { path = "crates/codewiki-analysis" }
codewiki-wiki = { path = "crates/codewiki-wiki" }
